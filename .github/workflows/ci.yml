name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Cyrius toolchain
        run: |
          set -e
          # The cyrius.cyml `[package].cyrius` pin is the single source of
          # truth for the toolchain version — no version is hardcoded in
          # this YAML. Read the pin and hand it to the upstream installer,
          # which fetches + lays out $HOME/.cyrius/{bin,lib}. Matches
          # patra / sigil / libro CI.
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies + verify the COMMITTED lock
        # ⚠ THIS REPLACED A BARE `cyrius deps`, AND THE ORDER WAS THE BUG.
        #
        # `cyrius deps --verify` CANNOT CATCH A STALE COMMITTED LOCK, because
        # this step resolved first. `cyrius deps` REWRITES cyrius.lock from
        # disk; the verify step below then checked the resolve against the file
        # the resolve had just written. That is tautological — "70 verified, 0
        # failed" no matter what was committed.
        #
        # Not hypothetical: 1.6.12 was first committed with cyrius.cyml at
        # argonaut tag = "1.13.8" and a lock still pinning 1.13.7's commit
        # (7204b60), because the tag did not exist yet at commit time. Replayed
        # against that exact tree, the resolve silently rewrote the pin in place
        # and verify reported success. CI would have gone green on it.
        #
        # verify-lock.sh saves the committed lock, resolves, compares SORTED
        # (cyrius does not emit the hash lines in a stable order, so a byte diff
        # is a false positive), and RESTORES the committed bytes on every exit
        # path — so the steps below still see exactly what the commit contained.
        # It also fails when a declared git dep has no commit line at all, which
        # is the `path`-override shape that shipped kybernet 1.5.4 unpinned.
        #
        # Verified able to go red on all four defect classes by injection:
        # a stale tag, a dropped commit line, a repointed sha, and a drifted
        # hash line. Verified green twice on the correct lock, for ordering
        # stability, and verified non-mutating.
        run: bash scripts/verify-lock.sh

      - name: Verify dep hashes
        # cyrius.lock pins sigil/agnostik/libro/argonaut hashes (plus patra
        # and sakshi pulled in transitively by libro). CI fails if a resolved
        # file's sha256 doesn't match the locked entry.
        #
        # Unconditional: the lock gate above hard-fails on a missing
        # cyrius.lock, so the old `if [ -f cyrius.lock ]` bootstrap branch was
        # unreachable — and an unreachable skip branch on a hash-verification
        # step is exactly the shape standing rule 32 forbids.
        run: cyrius deps --verify

      - name: Format check
        # `cyrius fmt <file> --check` sets the exit code (0 clean / 1 drift)
        # and leaves the file untouched. Verified non-mutating at 6.5.35.
        #
        # Do NOT go back to `diff -q <(cyrius fmt "$f") "$f"`. Cyrius 6.5.28
        # made `fmt` REWRITE IN PLACE and print nothing (flagged BREAKING
        # upstream; `--dry` is the old stdout behaviour). Under 6.5.35 that
        # gate diffs an empty stream against every file — reporting drift
        # unconditionally *and* silently reformatting the CI checkout
        # underneath the later build/test steps. Matches argonaut CI.
        run: |
          fail=0
          for f in src/main.cyr src/test.cyr src/bench.cyr src/lib/*.cyr; do
            [ -f "$f" ] || continue
            if ! cyrius fmt "$f" --check > /dev/null 2>&1; then
              echo "needs fmt: $f"
              fail=1
            fi
          done
          [ $fail -eq 0 ] || { echo "fmt: drift detected"; exit 1; }

      - name: Lint (HARD GATE)
        # ⚠ NOT advisory any more, and the untracked-deferral half is the
        # point. `cyrius lint` flags a comment that says deferred / not yet /
        # TODO without a cross-reference to a CHANGELOG or roadmap entry —
        # which is exactly how 1.6.0's four fatal defects went unnoticed:
        # every one of them was described in a comment nobody tracked.
        #
        # The tree is at 0 deferrals and 0 warnings as of 1.6.1. Keeping it
        # there is what stops docs/development/roadmap.md drifting back into
        # fiction. If this fails: either fix the line, or cross-reference the
        # deferral to the roadmap ON THE SAME LINE (the matcher is per-line).
        run: |
          FAIL=0
          for f in src/main.cyr src/test.cyr src/bench.cyr src/lib/*.cyr; do
            [ -f "$f" ] || continue
            # ⚠ THE EXIT STATUS IS CHECKED. Discarding it made this gate
            # vacuous in exactly the way it exists to prevent: `cyrius lint`
            # exits 1 without emitting its summary lines when the file does
            # not parse (verified: "does not parse, so lint checks were NOT
            # run"), or if a toolchain bump renames the subcommand. Both greps
            # then match nothing, D and W default to 0, and the step prints
            # "lint clean" having linted nothing.
            if ! OUT=$(cyrius lint "$f" 2>&1); then
              echo "$OUT"
              echo "::error::cyrius lint could not run on $f — the gate is not satisfied by a lint that did not happen"
              exit 1
            fi
            echo "$OUT"
            # A run that succeeded must still have produced both summary
            # lines; their absence means the output shape changed.
            printf '%s' "$OUT" | grep -qE '^[0-9]+ untracked deferrals' || {
              echo "::error::cyrius lint output has no 'untracked deferrals' line — shape changed, gate cannot read it"; exit 1; }
            printf '%s' "$OUT" | grep -qE '^[0-9]+ warnings' || {
              echo "::error::cyrius lint output has no 'warnings' line — shape changed, gate cannot read it"; exit 1; }
            D=$(printf '%s' "$OUT" | grep -oE '^[0-9]+ untracked' | grep -oE '^[0-9]+')
            W=$(printf '%s' "$OUT" | grep -oE '^[0-9]+ warnings' | grep -oE '^[0-9]+')
            if [ "${D:-0}" -gt 0 ] || [ "${W:-0}" -gt 0 ]; then FAIL=1; fi
          done
          if [ "$FAIL" -ne 0 ]; then
            echo "ERROR: lint is a hard gate — 0 untracked deferrals and 0 warnings required."
            exit 1
          fi
          echo "lint clean: 0 untracked deferrals, 0 warnings" 

      - name: Vet
        run: cyrius vet src/main.cyr

      - name: Build (DCE)
        run: |
          mkdir -p build
          CYRIUS_DCE=1 cyrius build src/main.cyr build/kybernet
          echo "kybernet: $(wc -c < build/kybernet) bytes"

      - name: Verify ELF
        # `od` is coreutils — always present. `xxd` was NOT: Ubuntu 24.04 split
        # it out of vim-common into its own package and nothing here installs
        # it, so this gate was one runner-image trim away from failing on a
        # perfectly good binary. Checks magic AND e_machine (0x003E = x86_64)
        # rather than magic alone, so a cross-built binary can't pass as native.
        run: |
          got=$(od -An -tx1 -j0 -N4 build/kybernet | tr -d ' \n')
          [ "$got" = "7f454c46" ] || { echo "ERROR: not an ELF (magic=$got)"; exit 1; }
          mach=$(od -An -tx1 -j18 -N2 build/kybernet | tr -d ' \n')
          [ "$mach" = "3e00" ] || { echo "ERROR: e_machine=$mach, expected 3e00 (x86_64)"; exit 1; }

      - name: Cross-build aarch64 (best-effort)
        # Only when the toolchain ships an aarch64 backend. cyrius 6.0.x
        # renamed cc5_aarch64 → cycc_aarch64 (cc5_aarch64 retained as a
        # symlink); accept either so the guard works across toolchain ages.
        run: |
          # ⚠ FAILS rather than skipping. CLAUDE.md's release gates list the
          # aarch64 cross-build as mandatory and README says both arches are
          # release-gated — but this step exited 0 with a warning when the
          # backend was absent, and release.yml then published with no
          # aarch64 artifact at all (`if [ -f ... ]`). A gate that advertises
          # an architecture and quietly ships without it is worse than one
          # that never claimed it. 1.6.1.
          if [ ! -x "$HOME/.cyrius/bin/cycc_aarch64" ] && [ ! -x "$HOME/.cyrius/bin/cc5_aarch64" ]; then
            echo "::error::no aarch64 backend (cycc_aarch64/cc5_aarch64) in this Cyrius toolchain"
            echo "kybernet release-gates BOTH architectures. Refusing to pass this step."
            exit 1
          fi
          CYRIUS_DCE=1 cyrius build --aarch64 src/main.cyr build/kybernet-aarch64
          # Read e_machine straight out of the ELF header: 0x00B7 = EM_AARCH64,
          # little-endian, so bytes 18..19 are "b700". This replaced
          # `file ... | grep aarch64` — `file` is base-image-only and undeclared,
          # and grepping its prose is looser than reading the field it prints.
          amach=$(od -An -tx1 -j18 -N2 build/kybernet-aarch64 | tr -d ' \n')
          [ "$amach" = "b700" ] || {
            echo "ERROR: kybernet-aarch64 e_machine=$amach, expected b700 (aarch64)"; exit 1; }
          echo "kybernet-aarch64: $(wc -c < build/kybernet-aarch64) bytes"

      - name: aarch64 execution gate
        # ⚠ THE ONLY GATE THAT EXECUTES AARCH64 CODE. Added 1.6.13 (HIGH-9).
        #
        # Before this, kybernet cross-built, e_machine-checked and PUBLISHED an
        # aarch64 artifact without ever running one aarch64 instruction of it.
        # README and CLAUDE.md both state both architectures are release-gated;
        # the whole arch half shipped on the cross-compiler exiting 0.
        #
        # What that hid is 1.6.13 CRITICAL-1: `sys_signalfd()` issues
        # `fsync(-1)` on aarch64, so setup_signals returns Err(EBADF), main.cyr
        # takes its phase-4 FATAL arm, and every aarch64 board powers itself
        # off before loading config. The published binary was 100%
        # non-functional and every gate was green. It also hid three
        # assertions in src/test.cyr that hardcoded x86_64 constants —
        # including the epoll_event data offset that WAS 1.4.2's CRITICAL-2.
        #
        # qemu-user-static is a declared apt install, not a host capability
        # this happens to find (standing rule 39). The gate carries a DECLARED
        # known-broken list and fails if the observed set drifts in either
        # direction — a new break, or a declared one that got fixed and left a
        # stale exception behind.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user-static
          bash scripts/aarch64-exec-gate.sh

      - name: Test
        # ⚠ THE COUNT IS ASSERTED, NOT JUST "0 failed". A suite that silently
        # SHRINKS passes the old check trivially — delete half the tests and
        # `0 failed` is still true. The floor comes from CLAUDE.md, which
        # carries the current number; raising it is a deliberate edit made in
        # the same commit that adds the tests.
        run: |
          cyrius test src/test.cyr 2>&1 | tee /tmp/test_output
          tail -1 /tmp/test_output | grep -E "^[0-9]+ passed," | grep -q "0 failed"
          COUNT=$(tail -1 /tmp/test_output | sed -E 's/^([0-9]+) passed.*/\1/')
          FLOOR=$(grep -oE '\(([0-9]+) tests must pass\)' CLAUDE.md | grep -oE '[0-9]+' | head -1)
          if [ -z "$FLOOR" ]; then echo "ERROR: could not read the test floor from CLAUDE.md"; exit 1; fi
          echo "assertions: ${COUNT} (floor from CLAUDE.md: ${FLOOR})"
          if [ "$COUNT" -lt "$FLOOR" ]; then
            echo "ERROR: the suite SHRANK — ${COUNT} < ${FLOOR}. Tests were removed, or a test_* stopped being called."
            exit 1
          fi

      - name: Shell scripts parse
        run: |
          for f in scripts/*.sh qemu/*.sh; do
            bash -n "$f" || { echo "ERROR: $f does not parse"; exit 1; }
          done
          echo "all shell scripts parse"

      - name: Credential generator self-test
        # scripts/mkcred.sh is the ONLY way an operator produces an
        # emergency_password_hash (1.5.9), so a broken generator is a broken
        # release even though nothing in src/ imports it. Its --check arm needs
        # no openssl at all; generating does, and only OpenSSL 3.2+ carries
        # ARGON2ID, so that half degrades to a warning on older runners rather
        # than a red build.
        run: |
          ./scripts/mkcred.sh --check \
            'v1$2$19456$1$6b796265726e65742d746573742d3031$2b314f63f14b4817f38b55e7c5c53e55a4973ce075d7a95ad2da3a4aa7c57c5e'
          # Every one of these must be REFUSED. A generator that emits a record
          # kybernet rejects is a footgun shipped to operators.
          for bad in \
            'v1$2$65537$1$6b796265726e65742d746573742d3031$2b314f63f14b4817f38b55e7c5c53e55a4973ce075d7a95ad2da3a4aa7c57c5e' \
            'v1$8$65536$1$6b796265726e65742d746573742d3031$2b314f63f14b4817f38b55e7c5c53e55a4973ce075d7a95ad2da3a4aa7c57c5e' \
            'v1$2$19456$4$6b796265726e65742d746573742d3031$2b314f63f14b4817f38b55e7c5c53e55a4973ce075d7a95ad2da3a4aa7c57c5e' \
            'f52fbd32b2b3b86ff88ef6c490628285f482af15ddcb29541f94bcf526a3f6c7' \
            'v1$2$19456$1$6b796265726e65742d746573742d3031$2b314f63f14b4817f38b55e7c5c53e55a4973ce075d7a95ad2da3a4aa7c57c5e$' \
            'v1$2$19456$1$6b796265726e65742d746573742d3031$2b314f63' \
            'v1$1$64$1$6b796265726e65742d746573742d3031$2b314f63f14b4817f38b55e7c5c53e55a4973ce075d7a95ad2da3a4aa7c57c5e'; do
            if ./scripts/mkcred.sh --check "$bad" >/dev/null 2>&1; then
              echo "ERROR: mkcred.sh --check accepted a record kybernet rejects: $bad"; exit 1
            fi
          done
          echo "mkcred.sh --check agrees with emergency_auth.cyr's bounds"
          # Records kybernet ACCEPTS that --check must not reject. The
          # leading-zero case is the one that used to make bash's $(( ))
          # abort the command and fall through into key generation.
          for good in \
            'v1$2$08192$1$6b796265726e65742d746573742d3031$2b314f63f14b4817f38b55e7c5c53e55a4973ce075d7a95ad2da3a4aa7c57c5e' \
            'v1$8$16384$1$6b796265726e65742d746573742d3031$2b314f63f14b4817f38b55e7c5c53e55a4973ce075d7a95ad2da3a4aa7c57c5e'; do
            out=$(./scripts/mkcred.sh --check "$good") || {
              echo "ERROR: mkcred.sh --check rejected a record kybernet accepts: $good"; exit 1; }
            case "$out" in OK:*) ;; *) echo "ERROR: --check fell through instead of reporting: $out"; exit 1 ;; esac
          done
          # Env overrides that would mint an unusable credential.
          # ⚠ ASSERT THE REASON, not just non-zero. mkcred.sh used to probe for
          # openssl ARGON2ID before validating bounds, so on this runner
          # (OpenSSL 3.0) all five died on the probe — five refusals for the
          # wrong reason, and this loop printed success having tested nothing.
          # The probe moved after the bounds; this makes that stay true.
          for bad_env in "TAG_BYTES=128" "SALT_BYTES=100" "P=4" "M=64" "T=8 M=65536"; do
            if MSG=$(env $bad_env KYB_PASSWORD='correct-horse-battery-staple' ./scripts/mkcred.sh 2>&1 >/dev/null); then
              echo "ERROR: mkcred.sh generated a credential kybernet rejects with $bad_env"; exit 1
            fi
            case "$MSG" in
              *outside*|*above*|*below*|*"work cap"*|*"must be 1"*) ;;
              *) echo "ERROR: '$bad_env' was refused for the WRONG reason: $MSG"; exit 1 ;;
            esac
          done
          echo "mkcred.sh refuses every out-of-range override"
          if openssl list -kdf-algorithms 2>/dev/null | grep -qi ARGON2ID; then
            REC=$(KYB_PASSWORD='correct-horse-battery-staple' ./scripts/mkcred.sh 2>/dev/null)
            echo "$REC" | grep -qE '^v1\$2\$19456\$1\$[0-9a-f]{32}\$[0-9a-f]{64}$' || {
              echo "ERROR: generated record has the wrong shape: $REC"; exit 1; }
            ./scripts/mkcred.sh --check "$REC"
            echo "mkcred.sh generated and self-validated a credential"
          else
            echo "::warning::openssl on this runner has no ARGON2ID ($(openssl version)) — generation half skipped"
          fi

      - name: Bench regression gate
        # ⚠ Standing rule 6 calls this a release gate that "blocks the cut",
        # and until 1.6.1 it existed only as human discipline — `grep -rn
        # bench-history .github/` returned nothing and this step ran a bare
        # `cyrius bench` under continue-on-error, asserting nothing.
        #
        # It could not have been a CI gate before: comparing raw absolute
        # ns/op meant dozens of false regressions on any shared runner. 1.6.0
        # fixed that with best-of-N plus normalisation against a calibration
        # loop, and the result was verified to still FAIL on a real
        # regression. So it can be a gate now.
        #
        # `benches/history.csv` is commit-keyed and a CI runner is not the
        # machine that recorded it, so the FIRST run on a new runner has no
        # calibration reference and compares raw — hence RUNS=5 here rather
        # than the default 3, and hence this stays advisory on pull_request
        # while being enforced on the release path.
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        env:
          RUNS: 5
        run: bash scripts/bench-history.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-x86_64
          path: build/kybernet
          retention-days: 5

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for dangerous patterns
        # kybernet is PID 1 — fork/execve via argonaut is intentional, but
        # raw exit/execve syscalls in lib modules are not. Scan code lines
        # only (skip comments via awk, not "grep -v '# '" which would also
        # eat lines with inline comments).
        run: |
          FAIL=0
          # ⚠ grep -rEn, NOT grep -rn. This helper took a pattern written in
          # ERE and fed it to BRE grep, where `\(` OPENS A GROUP — so
          # `\bsystem\s*\(` was an unmatched group, grep exited 2 with
          # "Unmatched ( or \(", stderr was discarded by 2>/dev/null and the
          # status was swallowed into the awk pipe. `hits` was therefore
          # ALWAYS empty and the check always reported clean. It was the only
          # caller of this helper, so the whole thing was decoration. 1.6.1.
          scan() {
            local label="$1"; shift
            local pat="$1"; shift
            local hits
            hits=$(grep -rEn "$pat" src/ 2>/dev/null | awk -F: '
              { line=$3; for(i=4;i<=NF;i++) line=line":"$i;
                sub(/^[[:space:]]+/,"",line);
                if (substr(line,1,1) != "#") print $1":"$2":"line }')
            if [ -n "$hits" ]; then
              echo "FAIL: $label"
              echo "$hits"
              FAIL=1
            fi
          }
          # Raw execve outside lib/process_mgmt territory (handled by argonaut).
          hits=$(grep -rn 'syscall( *59' src/lib/ 2>/dev/null || true)
          [ -n "$hits" ] && { echo "FAIL: raw execve in lib module"; echo "$hits"; FAIL=1; }
          # Direct exit(60) outside main entrypoint.
          hits=$(grep -rn 'syscall( *60' src/lib/ 2>/dev/null || true)
          [ -n "$hits" ] && { echo "FAIL: direct exit syscall in lib module"; echo "$hits"; FAIL=1; }
          scan "raw system()" 'system[[:space:]]*\('
          # Unbounded stack buffers (>= 64KB → require heap review).
          awk -F: '
            /var [A-Za-z_][A-Za-z0-9_]*\[[0-9]+\]/ {
              match($0, /\[[0-9]+\]/); s=substr($0,RSTART+1,RLENGTH-2); n=s+0;
              if (n >= 65536) print FILENAME":"NR": large stack buffer ("n" bytes): "$0
            }' src/*.cyr src/lib/*.cyr 2>/dev/null | tee /tmp/bigbuf.txt
          [ -s /tmp/bigbuf.txt ] && FAIL=1
          # Informational counts — fd hygiene tracking.
          OPENS=$(grep -rn 'sys_open' src/ 2>/dev/null | awk -F: '
            { line=$3; sub(/^[[:space:]]+/,"",line);
              if (substr(line,1,1) != "#") print }' | wc -l)
          CLOSES=$(grep -rn 'sys_close' src/ 2>/dev/null | awk -F: '
            { line=$3; sub(/^[[:space:]]+/,"",line);
              if (substr(line,1,1) != "#") print }' | wc -l)
          echo "sys_open: $OPENS, sys_close: $CLOSES (informational)"
          echo "security scan complete (fail: $FAIL)"
          exit $FAIL

  qemu-harness:
    name: QEMU PID-1 harness (best-effort)
    runs-on: ubuntu-latest
    # KVM is mandatory, not optional: sakshi's clock_init hard-requires
    # invariant TSC (CPUID 80000007h EDX bit 8), and QEMU's TCG software
    # engine does NOT implement that bit — `+invtsc` is silently dropped
    # under TCG and the boot panics ("Attempted to kill init"). So we must
    # use real KVM. GitHub-hosted Linux runners DO expose /dev/kvm (Azure
    # nested virt) but leave it root-only; this job installs qemu, opens
    # /dev/kvm perms (the same udev rule the android-emulator-runner action
    # uses), unlocks the host kernel image, then runs the real PID-1 boot.
    # ⚠ NO continue-on-error. This is a HARD GATE as of 1.6.1.
    #
    # It was advisory "until reliably green", and the cost of that was
    # measured rather than argued: 1.6.0 shipped four defects that a harness
    # assertion would have caught, and 1.6.1's first new fixture found a
    # SIGSEGV in argonaut's watchdog that panicked PID 1. A gate that cannot
    # turn the build red is a log line.
    #
    # The missing-prerequisite path is handled honestly instead: if KVM or a
    # kernel image genuinely is not available the job FAILS with a clear
    # reason rather than passing silently. Set ALLOW_HARNESS_SKIP=1 in repo
    # variables to restore the old behaviour on a runner that cannot host it.
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU + enable KVM
        run: |
          sudo apt-get update
          # ⚠ cryptsetup-bin AND busybox-static are load-bearing, not extras.
          # Without veritysetup, build-initramfs.sh drops ALL THREE of the
          # edge and auth fixtures, and boot-test.sh then SKIPs passes 3, 4a
          # and 4b — 28 of its assertions, including both credential formats
          # that CLAUDE.md rule 26 says are gated. The job went green having
          # tested a quarter of what it advertises.
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 cpio cryptsetup-bin busybox-static python3
          # python3, NOT python3-minimal: build-initramfs.sh imports `json` and
          # `pathlib`, and neither is in the minimal subset (they live in
          # libpython3.x-stdlib). `file` and `xxd` were listed here briefly and
          # are not called by anything — the busybox static/dynamic probe moved
          # to `ldd`, which libc-bin always provides.
          # /dev/kvm exists on hosted runners but is root:kvm 0660 and the
          # runner user isn't in the kvm group. Make the node world-RW.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true

      - name: Check prerequisites
        id: prereqs
        run: |
          missing=""
          [ -r /dev/kvm ] || missing="$missing /dev/kvm(no-nested-virt)"
          command -v qemu-system-x86_64 >/dev/null 2>&1 || missing="$missing qemu-system-x86_64"
          KERNEL=""
          for cand in /boot/vmlinuz-linux-lts /boot/vmlinuz-linux /boot/vmlinuz-$(uname -r) /boot/vmlinuz; do
            [ -f "$cand" ] && KERNEL="$cand" && break
          done
          if [ -n "$KERNEL" ]; then
            # Distro kernels are mode 0600 root — make readable so qemu
            # (running as the unprivileged runner user) can load it.
            sudo chmod +r "$KERNEL" || true
            [ -r "$KERNEL" ] || missing="$missing kernel-unreadable"
          else
            missing="$missing kernel-image"
          fi
          if [ -n "$missing" ]; then
            if [ "${{ vars.ALLOW_HARNESS_SKIP }}" = "1" ]; then
              echo "::warning::QEMU harness skipped — missing:$missing (ALLOW_HARNESS_SKIP=1)"
              echo "skip=1" >> $GITHUB_OUTPUT
            else
              echo "::error::QEMU harness CANNOT RUN — missing:$missing"
              echo "This is the only gate that boots kybernet as real PID 1. Failing rather"
              echo "than passing silently. Set repo variable ALLOW_HARNESS_SKIP=1 to override."
              exit 1
            fi
          else
            echo "Using kernel: $KERNEL"
            echo "kernel=$KERNEL" >> $GITHUB_OUTPUT
            echo "skip=0" >> $GITHUB_OUTPUT
          fi

      - name: Install Cyrius toolchain
        if: steps.prereqs.outputs.skip == '0'
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Resolve deps + build kybernet
        if: steps.prereqs.outputs.skip == '0'
        run: |
          cyrius deps
          mkdir -p build
          CYRIUS_DCE=1 cyrius build src/main.cyr build/kybernet

      - name: Run harness
        if: steps.prereqs.outputs.skip == '0'
        # No BUDGET_MS override any more. It used to be raised to 8000 here
        # because the gate measured WALL time, which on the runner is ~82%
        # kernel boot — so the override was compensating for the metric being
        # wrong rather than for kybernet being slow. 1.6.1 changed the gate to
        # kybernet's own span (`kybernet: starting` -> `kybernet: shutdown`),
        # measured at 494 ms on this exact kernel, and the script's 1200 ms
        # default already carries 2.4x headroom. Setting 8000 here now would
        # just re-blind the gate.
        #
        # WALL_CEILING_MS keeps a loose liveness bound on the whole VM; the
        # script's 20000 default is fine under nested virt and the 60s qemu
        # timeout is still the outer backstop.
        run: |
          # HARNESS_STRICT: CI installs cryptsetup-bin and busybox-static, so
          # a missing fixture here means fixture GENERATION broke — which is
          # precisely the regression a silent SKIP would hide.
          HARNESS_STRICT=1 bash qemu/boot-test.sh "${{ steps.prereqs.outputs.kernel }}" 60

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        run: |
          MISSING=0
          for f in README.md CHANGELOG.md VERSION CONTRIBUTING.md SECURITY.md \
                   LICENSE CLAUDE.md cyrius.cyml; do
            if [ -f "$f" ]; then echo "  OK: $f"
            else echo "  MISSING: $f"; MISSING=1; fi
          done
          exit $MISSING

      - name: Verify version consistency
        # cyrius.cyml pulls package.version from VERSION via ${file:VERSION};
        # just check VERSION appears in CHANGELOG.
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "VERSION file: $VERSION"
          grep -qF "## [$VERSION]" CHANGELOG.md || { echo "FAIL: version not in CHANGELOG.md"; exit 1; }
          echo "Version consistent (cyrius.cyml pulls VERSION via \${file:VERSION})"
