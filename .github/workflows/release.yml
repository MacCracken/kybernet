name: Release

on:
  push:
    # Accept both `v1.2.3` and `1.2.3` tag styles. Version-verify enforces
    # semver shape + match against VERSION file.
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  build:
    name: Build Release
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify version
        run: |
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          CYML_RAW=$(grep '^version = ' cyrius.cyml | head -1 | sed 's/version = "\(.*\)"/\1/')
          # ${file:VERSION} template means cyml derives version from the
          # VERSION file — VERSION is the single source of truth. Resolve
          # the template to the file content for the consistency check.
          if [ "$CYML_RAW" = "\${file:VERSION}" ]; then
              CYML_VERSION="$FILE_VERSION"
          else
              CYML_VERSION="$CYML_RAW"
          fi
          TAG="${GITHUB_REF_NAME#v}"   # strip optional leading 'v' so v1.0.0 == 1.0.0
          echo "$TAG" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "tag ($TAG) is not semver x.y.z"; exit 1; }
          [ "$FILE_VERSION" = "$TAG" ] || {
            echo "VERSION ($FILE_VERSION) != tag ($TAG)"; exit 1; }
          [ "$CYML_VERSION" = "$TAG" ] || {
            echo "cyrius.cyml ($CYML_RAW) != tag ($TAG)"; exit 1; }
          echo "Version verified: $TAG (cyml: $CYML_RAW)"

      - name: Install Cyrius toolchain
        run: |
          set -e
          # The cyrius.cyml `[package].cyrius` pin is the single source of
          # truth for the toolchain version — no version is hardcoded in
          # this YAML. Read the pin and hand it to the upstream installer,
          # which fetches + lays out $HOME/.cyrius/{bin,lib}. Matches
          # patra / sigil / libro CI.
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          # --retry: a transient raw.githubusercontent blip otherwise fails the
          # whole release with a curl error that looks nothing like a network
          # problem (an empty script piped to sh exits 0, so -f matters too).
          curl -sSf --retry 3 --retry-all-errors --retry-delay 2 \
            https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Resolve deps
        run: cyrius deps

      - name: Verify dep hashes
        run: |
          if [ -f cyrius.lock ]; then
            cyrius deps --verify
          else
            echo "::warning::cyrius.lock not committed — skipping hash verification"
          fi

      - name: Build x86_64 (DCE)
        run: |
          mkdir -p build
          CYRIUS_DCE=1 cyrius build src/main.cyr build/kybernet
          echo "kybernet: $(wc -c < build/kybernet) bytes"

      - name: Cross-build aarch64
        # cyrius 6.0.x renamed cc5_aarch64 → cycc_aarch64 (cc5_aarch64 kept
        # as a symlink); accept either so the guard works across toolchain ages.
        run: |
          # ⚠ HARD ERROR, matching ci.yml. This was "best-effort": a missing
          # aarch64 backend printed ::warning:: and the job carried on, and the
          # publish step's `files:` glob tolerates a missing artifact — so a
          # toolchain without the backend produced a PUBLISHED RELEASE with no
          # aarch64 binary in it. ci.yml already refuses that (1.6.1), but ci.yml
          # is not the path that ships; this is. A release that advertises two
          # architectures and quietly delivers one is the defect ci.yml's own
          # comment describes as "worse than one that never claimed it".
          if [ ! -x "$HOME/.cyrius/bin/cycc_aarch64" ] && [ ! -x "$HOME/.cyrius/bin/cc5_aarch64" ]; then
            echo "::error::no aarch64 backend (cycc_aarch64/cc5_aarch64) in this Cyrius toolchain"
            echo "kybernet release-gates BOTH architectures. Refusing to publish."
            exit 1
          fi
          CYRIUS_DCE=1 cyrius build --aarch64 src/main.cyr build/kybernet-aarch64
          echo "kybernet-aarch64: $(wc -c < build/kybernet-aarch64) bytes"

      - name: Test
        run: |
          cyrius test src/test.cyr 2>&1 | tee /tmp/test_output
          tail -1 /tmp/test_output | grep -E "^[0-9]+ passed," | grep -q "0 failed"

      - name: Clean toolchain artifacts
        run: rm -f cyrius-*.tar.gz

      - name: Archive
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="kybernet-${TAG}/" -o "kybernet-${TAG}-src.tar.gz" HEAD
          # ⚠ BOTH BINARIES ARE REQUIRED. These were `if [ -f ... ]`, so a
          # release could publish with no aarch64 artifact and say nothing —
          # while README and CLAUDE.md both state that both architectures are
          # release-gated. Missing either one is a broken release, not a
          # smaller one. 1.6.1.
          for pair in "build/kybernet:x86_64-linux" "build/kybernet-aarch64:aarch64-linux"; do
            src="${pair%%:*}"; suffix="${pair##*:}"
            if [ ! -f "$src" ]; then
              echo "::error::$src missing — kybernet release-gates both architectures"
              exit 1
            fi
            cp "$src" "kybernet-${TAG}-${suffix}"
          done
          file "kybernet-${TAG}-aarch64-linux" | grep -q "aarch64" || {
            echo "::error::the aarch64 artifact is not an aarch64 ELF"; exit 1; }
          sha256sum kybernet-*.tar.gz kybernet-*-linux 2>/dev/null > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            kybernet-*.tar.gz
            kybernet-*-linux
            cyrius.lock
            SHA256SUMS

  release:
    name: Create GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts

      - name: Extract changelog
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          awk "/^## \\[${TAG}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" \
            CHANGELOG.md > /tmp/body.md
          # ⚠ FAIL, do not substitute a placeholder. This used to write
          # "No changelog entry for $TAG." into the body and publish it — so a
          # forgotten CHANGELOG section produced a real, public GitHub release
          # whose notes said there were none. ci.yml already asserts the section
          # exists (`grep -qF "## [$VERSION]"`); this makes the publish path
          # refuse rather than paper over it.
          [ -s /tmp/body.md ] || {
            echo "::error::no CHANGELOG entry for $TAG — add a '## [$TAG]' section before tagging"
            exit 1
          }

      - uses: softprops/action-gh-release@v2
        with:
          name: "kybernet ${{ github.ref_name }}"
          body_path: /tmp/body.md
          prerelease: ${{ startsWith(github.ref_name, '0.') || startsWith(github.ref_name, 'v0.') }}
          # Without this, an unmatched glob is silently skipped and the release
          # publishes with whatever happens to exist — the exact failure mode
          # the aarch64 hard-error above closes off at the other end.
          fail_on_unmatched_files: true
          files: |
            kybernet-*.tar.gz
            kybernet-*-linux
            cyrius.lock
            SHA256SUMS
