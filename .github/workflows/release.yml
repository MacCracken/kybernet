name: Release

on:
  push:
    # Accept both `v1.2.3` and `1.2.3` tag styles. Version-verify enforces
    # semver shape + match against VERSION file.
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  build:
    name: Build Release
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify version
        run: |
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          CYML_RAW=$(grep '^version = ' cyrius.cyml | head -1 | sed 's/version = "\(.*\)"/\1/')
          # ${file:VERSION} template means cyml derives version from the
          # VERSION file — VERSION is the single source of truth. Resolve
          # the template to the file content for the consistency check.
          if [ "$CYML_RAW" = "\${file:VERSION}" ]; then
              CYML_VERSION="$FILE_VERSION"
          else
              CYML_VERSION="$CYML_RAW"
          fi
          TAG="${GITHUB_REF_NAME#v}"   # strip optional leading 'v' so v1.0.0 == 1.0.0
          echo "$TAG" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "tag ($TAG) is not semver x.y.z"; exit 1; }
          [ "$FILE_VERSION" = "$TAG" ] || {
            echo "VERSION ($FILE_VERSION) != tag ($TAG)"; exit 1; }
          [ "$CYML_VERSION" = "$TAG" ] || {
            echo "cyrius.cyml ($CYML_RAW) != tag ($TAG)"; exit 1; }
          echo "Version verified: $TAG (cyml: $CYML_RAW)"

      - name: Install Cyrius toolchain
        run: |
          set -e
          # The cyrius.cyml `[package].cyrius` pin is the single source of
          # truth for the toolchain version — no version is hardcoded in
          # this YAML. Read the pin and hand it to the upstream installer,
          # which fetches + lays out $HOME/.cyrius/{bin,lib}. Matches
          # patra / sigil / libro CI.
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          # --retry: a transient raw.githubusercontent blip otherwise fails the
          # whole release with a curl error that looks nothing like a network
          # problem (an empty script piped to sh exits 0, so -f matters too).
          curl -sSf --retry 3 --retry-all-errors --retry-delay 2 \
            https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Resolve deps + verify the COMMITTED lock
        # Same gate as ci.yml, and THIS is the path where it matters most: a
        # stale lock caught on a PR is an inconvenience, a stale lock on the
        # release path is a published artifact built against a dependency the
        # tag does not name.
        #
        # `cyrius deps --verify` alone cannot see it — `cyrius deps` rewrites
        # cyrius.lock from disk and the verify then checks the resolve against
        # the file it just wrote. See scripts/verify-lock.sh for the 1.6.12
        # case this was written from, and CHANGELOG.md [1.6.13].
        run: bash scripts/verify-lock.sh

      - name: Verify dep hashes
        # Unconditional — the lock gate above hard-fails on a missing
        # cyrius.lock, so the old bootstrap skip branch was unreachable.
        run: cyrius deps --verify

      - name: Build x86_64 (DCE)
        run: |
          mkdir -p build
          CYRIUS_DCE=1 cyrius build src/main.cyr build/kybernet
          echo "kybernet: $(wc -c < build/kybernet) bytes"

      - name: Cross-build aarch64
        # cyrius 6.0.x renamed cc5_aarch64 → cycc_aarch64 (cc5_aarch64 kept
        # as a symlink); accept either so the guard works across toolchain ages.
        run: |
          # ⚠ HARD ERROR, matching ci.yml. This was "best-effort": a missing
          # aarch64 backend printed ::warning:: and the job carried on, and the
          # publish step's `files:` glob tolerates a missing artifact — so a
          # toolchain without the backend produced a PUBLISHED RELEASE with no
          # aarch64 binary in it. ci.yml already refuses that (1.6.1), but ci.yml
          # is not the path that ships; this is. A release that advertises two
          # architectures and quietly delivers one is the defect ci.yml's own
          # comment describes as "worse than one that never claimed it".
          if [ ! -x "$HOME/.cyrius/bin/cycc_aarch64" ] && [ ! -x "$HOME/.cyrius/bin/cc5_aarch64" ]; then
            echo "::error::no aarch64 backend (cycc_aarch64/cc5_aarch64) in this Cyrius toolchain"
            echo "kybernet release-gates BOTH architectures. Refusing to publish."
            exit 1
          fi
          CYRIUS_DCE=1 cyrius build --aarch64 src/main.cyr build/kybernet-aarch64
          echo "kybernet-aarch64: $(wc -c < build/kybernet-aarch64) bytes"

      - name: aarch64 must actually BOOT before it is published
        # ⚠ THIS STEP BLOCKED EVERY RELEASE AT 1.6.13 AND 1.6.14, AND THAT WAS A
        # DESIGN ERROR — fixed here.
        #
        # It ran the probe with an EMPTY declared-broken list and failed the whole
        # workflow on any breakage, with the only escape being a repo variable a
        # maintainer had to set by hand in GitHub settings. So an upstream compiler
        # bug that kybernet cannot fix, in ONE architecture, stopped a perfectly
        # good x86_64 binary from shipping at all. Refusing to publish a dead
        # aarch64 artifact is right; refusing to publish ANYTHING is not
        # proportionate, and "go set a repo variable" is not a release process.
        #
        # THREE STATES, not two:
        #   1. clean            -> publish both architectures.
        #   2. exactly the      -> DROP the aarch64 artifact, publish x86_64, and
        #      DECLARED known       say so in the release notes. The omission is
        #      breakage             loud, which is what standing rule 32's "worse
        #                           than one that never claimed it" is actually
        #                           about — quietly delivering less, not delivering
        #                           less.
        #   3. anything else    -> HARD FAIL. A new or different breakage is a
        #                          regression and must stop the release.
        #
        # The declared set lives in scripts/aarch64-exec-gate.sh
        # (AARCH64_KNOWN_BROKEN) and is currently sys_signalfd + sys_pause, both
        # traced to one cyrius codegen defect: filed upstream 2026-08-27 as
        # docs/development/issues/2026-08-27-aarch64-esysxlat-eats-native-signalfd4-and-ppoll.md
        # with a repro, and there is NO consumer-side workaround (five attempts
        # recorded in the filing). When a fixed cycc is pinned, drop the two names
        # from that list and state 1 starts publishing both arches again on its own.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user-static

          if AARCH64_KNOWN_BROKEN="" bash scripts/aarch64-exec-gate.sh; then
            echo "aarch64 boot-critical primitives are sound — publishing both arches"
          elif bash scripts/aarch64-exec-gate.sh; then
            # Passes against the DECLARED set => the breakage is exactly the known
            # upstream one and nothing new.
            echo "::warning::aarch64 omitted from this release — the known upstream cyrius defect"
            rm -f build/kybernet-aarch64
            echo "KYB_DROP_AARCH64=1" >> "$GITHUB_ENV"
            {
              echo ""
              echo "---"
              echo ""
              echo "### ⚠ No aarch64 binary in this release"
              echo ""
              echo "\`kybernet-<tag>-aarch64-linux\` is **deliberately omitted**. On aarch64 the"
              echo "cyrius 6.5.35 backend mis-emits two syscalls kybernet's boot path depends on:"
              echo "\`sys_signalfd()\` issues \`fsync(2)\` and \`sys_pause()\` issues \`flock(2)\`, so"
              echo "\`setup_signals()\` fails EBADF and PID 1 powers the board off at phase 4."
              echo ""
              echo "The defect is in the compiler, not in kybernet, and there is no workaround"
              echo "available to a consumer. It is filed upstream with a runnable repro"
              echo "(\`2026-08-27-aarch64-esysxlat-eats-native-signalfd4-and-ppoll.md\`)."
              echo "Shipping the binary anyway would mean publishing an artifact whose only"
              echo "outcome is a poweroff, so it is left out rather than shipped broken."
              echo ""
              echo "The **x86_64** binary is unaffected and fully gated: it is built, unit-tested,"
              echo "and booted as real PID 1 under QEMU before publication."
            } > AARCH64-OMITTED.md
          else
            echo "::error::the aarch64 probe found breakage that is NOT the declared upstream defect"
            echo "That is a regression, not a known issue — refusing to publish."
            echo "Re-run scripts/aarch64-exec-gate.sh locally to see which primitive changed."
            exit 1
          fi

      - name: Test
        run: |
          cyrius test src/test.cyr 2>&1 | tee /tmp/test_output
          tail -1 /tmp/test_output | grep -E "^[0-9]+ passed," | grep -q "0 failed"

      - name: Clean toolchain artifacts
        run: rm -f cyrius-*.tar.gz

      - name: Archive
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="kybernet-${TAG}/" -o "kybernet-${TAG}-src.tar.gz" HEAD
          # ⚠ BOTH BINARIES ARE REQUIRED. These were `if [ -f ... ]`, so a
          # release could publish with no aarch64 artifact and say nothing —
          # while README and CLAUDE.md both state that both architectures are
          # release-gated. Missing either one is a broken release, not a
          # smaller one. 1.6.1.
          for pair in "build/kybernet:x86_64-linux" "build/kybernet-aarch64:aarch64-linux"; do
            src="${pair%%:*}"; suffix="${pair##*:}"
            # The ONE sanctioned absence: the boot-critical probe above found
            # exactly the declared upstream cyrius defect and dropped the artifact
            # rather than publish one that cannot boot. The release notes carry
            # AARCH64-OMITTED.md explaining it, so this is a LOUD omission, not a
            # quiet one. Every other absence is still a broken release.
            if [ "$suffix" = "aarch64-linux" ] && [ "${KYB_DROP_AARCH64:-0}" = "1" ]; then
              echo "::warning::aarch64 artifact omitted — see AARCH64-OMITTED.md in the release body"
              continue
            fi
            if [ ! -f "$src" ]; then
              echo "::error::$src missing — kybernet release-gates both architectures"
              exit 1
            fi
            cp "$src" "kybernet-${TAG}-${suffix}"
          done
          # ⚠ `od`, not `file`. `file` is base-image-only and installed by
          # nothing here (standing rule 39 — Ubuntu 24.04 already split `xxd`
          # out from under a gate this way), and grepping its prose is looser
          # than reading the field it prints. 0xB7 = EM_AARCH64, little-endian,
          # so header bytes 18..19 are "b700". Matches ci.yml. 1.6.13.
          if [ "${KYB_DROP_AARCH64:-0}" != "1" ]; then
            amach=$(od -An -tx1 -j18 -N2 "kybernet-${TAG}-aarch64-linux" | tr -d ' \n')
            [ "$amach" = "b700" ] || {
              echo "::error::the aarch64 artifact has e_machine=$amach, expected b700"; exit 1; }
          fi
          sha256sum kybernet-*.tar.gz kybernet-*-linux 2>/dev/null > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            kybernet-*.tar.gz
            kybernet-*-linux
            cyrius.lock
            SHA256SUMS
            AARCH64-OMITTED.md

  release:
    name: Create GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts

      - name: Extract changelog
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          awk "/^## \\[${TAG}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" \
            CHANGELOG.md > /tmp/body.md
          # ⚠ FAIL, do not substitute a placeholder. This used to write
          # "No changelog entry for $TAG." into the body and publish it — so a
          # forgotten CHANGELOG section produced a real, public GitHub release
          # whose notes said there were none. ci.yml already asserts the section
          # exists (`grep -qF "## [$VERSION]"`); this makes the publish path
          # refuse rather than paper over it.
          [ -s /tmp/body.md ] || {
            echo "::error::no CHANGELOG entry for $TAG — add a '## [$TAG]' section before tagging"
            exit 1
          }
          # The build job writes AARCH64-OMITTED.md only when it dropped the
          # aarch64 artifact over the known upstream cyrius defect. Appending it
          # to the body is what makes that omission LOUD: anyone reading the
          # release sees why the binary they expected is not there, rather than
          # finding a shorter file list and drawing their own conclusion.
          if [ -f AARCH64-OMITTED.md ]; then
            cat AARCH64-OMITTED.md >> /tmp/body.md
            echo "aarch64 omission notice appended to the release body"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          name: "kybernet ${{ github.ref_name }}"
          body_path: /tmp/body.md
          prerelease: ${{ startsWith(github.ref_name, '0.') || startsWith(github.ref_name, 'v0.') }}
          # Without this, an unmatched glob is silently skipped and the release
          # publishes with whatever happens to exist — the exact failure mode
          # the aarch64 hard-error above closes off at the other end.
          fail_on_unmatched_files: true
          files: |
            kybernet-*.tar.gz
            kybernet-*-linux
            cyrius.lock
            SHA256SUMS
